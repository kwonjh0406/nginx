server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    charset utf-8;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /kwonjh0406/api {
        # Using a variable for the upstream endpoint prevents Nginx from failing to start if the DNS is temporarily unresolvable.
        # 169.254.169.253 is the AWS VPC DNS, 8.8.8.8 is a fallback.
        resolver 169.254.169.253 8.8.8.8 valid=30s;
        set $upstream_endpoint internal-zones-fastapi-internal-alb-634049921.ap-southeast-1.elb.amazonaws.com:8003;

        proxy_pass http://$upstream_endpoint/api;
        proxy_set_header Host $upstream_endpoint;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: Custom error page
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
