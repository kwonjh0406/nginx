name: Multi-Container Deployment (Nginx & FastAPI)

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: "${{ secrets.AWS_ACCESS_KEY }}"
          aws-secret-access-key: "${{ secrets.AWS_SECRET_KEY }}"
          aws-region: "${{ secrets.AWS_REGION }}"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          NGINX_REPO: ${{ secrets.AWS_ECR_REPOSITORY }}
          FASTAPI_REPO: ${{ secrets.AWS_ECR_REPOSITORY_2 }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # 변수 정제 (줄바꿈 제거)
          CLEAN_NGINX=$(echo $NGINX_REPO | tr -d '[:space:]')
          CLEAN_FASTAPI=$(echo $FASTAPI_REPO | tr -d '[:space:]')
          
          # 1. FastAPI 빌드 및 푸시 (Repository 2)
          docker build -t "$ECR_REGISTRY/$CLEAN_FASTAPI:$IMAGE_TAG" -t "$ECR_REGISTRY/$CLEAN_FASTAPI:latest" ./fastapi
          docker push "$ECR_REGISTRY/$CLEAN_FASTAPI:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$CLEAN_FASTAPI:latest"
          
          # 2. Nginx 빌드 및 푸시 (Repository 1)
          docker build -t "$ECR_REGISTRY/$CLEAN_NGINX:$IMAGE_TAG" -t "$ECR_REGISTRY/$CLEAN_NGINX:latest" .
          docker push "$ECR_REGISTRY/$CLEAN_NGINX:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$CLEAN_NGINX:latest"

      - name: Deploy to EC2 via SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          NGINX_REPO: ${{ secrets.AWS_ECR_REPOSITORY }}
          FASTAPI_REPO: ${{ secrets.AWS_ECR_REPOSITORY_2 }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          CLEAN_NGINX=$(echo $NGINX_REPO | tr -d '[:space:]')
          CLEAN_FASTAPI=$(echo $FASTAPI_REPO | tr -d '[:space:]')
          
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploying Nginx and FastAPI to separate repos" \
            --parameters "{
              \"commands\": [
                \"aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | sudo docker login --username AWS --password-stdin $ECR_REGISTRY\",
                
                \"# 1. FastAPI 컨테이너 실행 (Repo 2)\",
                \"sudo docker pull $ECR_REGISTRY/$CLEAN_FASTAPI:$IMAGE_TAG\",
                \"# 이름이 다른 경우를 대비해 둘 다 중지 시도\",
                \"sudo docker stop fastapi-server fastapi-app || true\",
                \"sudo docker rm fastapi-server fastapi-app || true\",
                \"# 최종적으로 fastapi-server라는 이름으로 실행\",
                \"sudo docker run -d --name fastapi-server -p 8000:8000 $ECR_REGISTRY/$CLEAN_FASTAPI:$IMAGE_TAG\",
                
                \"# 2. Nginx 컨테이너 실행 (Repo 1)\",
                \"sudo docker pull $ECR_REGISTRY/$CLEAN_NGINX:$IMAGE_TAG\",
                \"sudo docker stop nginx-server || true\",
                \"sudo docker rm nginx-server || true\",
                \"sudo docker run -d --name nginx-server -p 80:80 $ECR_REGISTRY/$CLEAN_NGINX:$IMAGE_TAG\",
                
                \"sudo docker image prune -f\"
              ]
            }" \
            --region ${{ secrets.AWS_REGION }}
